version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    ignore:
      # Major-version bumps are never automatic. The dependency surface
      # is small — cobra in cmd/, plus its transitive deps pflag and
      # mousetrap — and any new require entry is a decision that should
      # be reviewed, not merged by a bot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"

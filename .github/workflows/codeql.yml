name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  security-events: write
  contents: read
  # Required for private repos; harmless on public
  actions: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          # Single source of truth: go.mod's go directive.
          go-version-file: "go.mod"
          cache: true

      - uses: github/codeql-action/init@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          languages: go
          # Extend with security-and-quality for a broader ruleset
          queries: security-extended

      - uses: github/codeql-action/analyze@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          category: "/language:go"
